# docker-compose.yml —— 本地开发基础设施（PostgreSQL 起步）
# 业务：本机一键起企业级方案的数据底座；数据落命名卷 pgdata，删容器不丢数据
# 使用：docker compose up -d    （停：docker compose down；删卷重来：docker compose down -v）
services:
  postgres:
    image: postgres:16-alpine
    container_name: flowinvoice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowinvoice          # 库账号
      POSTGRES_PASSWORD: flowinvoice_dev  # 仅本地开发密码，生产必换
      POSTGRES_DB: flowinvoice            # 库名
    ports:
      - "5432:5432"                       # 宿主端口:容器端口
    volumes:
      - pgdata:/var/lib/postgresql/data   # 数据持久化卷
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowinvoice -d flowinvoice"]
      interval: 5s
      timeout: 3s
      retries: 10

  # —— 后续按企业级方案逐步扩展（docs/06 生产架构）——
  # redis:   缓存 / 发票池查重快速集
  # minio:   发票源文件对象存储（XML/OFD/PDF/图片，DB 只存 object key）
  # api:     应用服务（后端 + 前端）
  # pgadmin: 可视化管理（可选，起单次会话看数据用）

volumes:
  pgdata:                                 # 命名卷：数据生命周期独立于容器
