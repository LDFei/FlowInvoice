# app/policy/travel.yaml —— 差旅政策规则（配置驱动，不写死在代码）
# 业务：企业差旅制度数字化；改动制度只需改 YAML，不动代码（docs/AGENTS.md §9）

hotel_daily_limit: 300          # 住宿每日上限（元）—— 对齐条款 3.2「普通员工一线城市 300 元/晚」口径
                                # 检查（B1，nodes._hotel_daily_basis）：明细行可推算单晚价（qty>1 且单价×qty≈金额 → 单价即每晚；
                                #   拆行各为单晚 → 行金额），取单日最高比较；无明细/不可拆分 → 按总额近似（宁标不放过）
                                # 假设边界：qty 按晚数近似（真实企业无晚数字段时按发票结构尽力推算，超标单向不放行）
advance_required: true          # 差旅是否必须事前申请
advance_valid_days: 30          # 出差申请有效期（天，申请结束日期后顺延）

# —— 发票合规确定性闸门（#87：发票"本身是否合规"→ 硬闸门，直接退回，不进人工复核）——
# 业务：政府条例级检查（真伪/查重在 verify 节点）之外，本层承接票种/抬头/报销时限三类确定性闸门；
#       真实企业制度替换只需改 YAML，不动代码
invoice_types:                  # 该业务接受报销的票种白名单（错票种 → 拒收；与 TravelModule.invoice_types 一致）
  - 火车票
  - 机票
  - 酒店发票
  - 打车行程单
company_name: "我司科技有限公司"  # 增值税发票购方抬头（须与报销主体一致才能入账抵扣）
                                # 闸门口径：票面带"购方"且**已填但非本公司** → buyer_mismatch 拒收；
                                #   票面无可核对的购方（实名票据火车/机票/打车、纸质票）→ 无法证明有误，不误伤放行
invoice_reimburse_deadline_days: 180  # 报销时限：票面日期距今超 N 天 → invoice_expired 退回
                                #   依据：铁路电子客票报销凭证 180 天内可打印/报销（对账条款 3.5 + 铁路规则）；可收紧

# —— 城市间交通席别标准（#85：按职级分档，条款 3.1 数字化）——
# 条款 3.1：高管 高铁商务座；总监 高铁一等座；普通员工 高铁二等座（超支自理）。
# 说明：条款未单列"经理"档，此处按与普通员工同档从紧；制度修订只需改本表（假说注释：越权乘席 = 企业软闸门，
#       由复核人特批记录，见 nodes.check_compliance + decide 批注要求）
rail_seat_classes: [二等座, 一等座, 商务座]   # 高铁席别，升序（低→高），等级比较按下标
grade_max_rail_seat:
  普通员工: 二等座
  经理: 二等座
  总监: 一等座
  高管: 商务座

approval_rules:                 # 审批链规则（金额阈值 × 业务类型）
  # 业务：审批链长度/成员由公司制度决定（改 YAML 即改制度）；财务不参与审批，仅在批准后收付款通知（审批≠支付）
  - max_amount: 2000            # 小额（金额 < 2000）：直属上级单级审批，总经理仅收到告知（不占审批资源）
    chain: ["直属上级"]
  - min_amount: 2000            # 大额（金额 ≥ 2000）：需总经理最终审批
    chain: ["直属上级", "总经理"]
