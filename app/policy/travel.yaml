# app/policy/travel.yaml —— 差旅政策规则（配置驱动，不写死在代码）
# 业务：企业差旅制度数字化；改动制度只需改 YAML，不动代码（docs/AGENTS.md §9）

hotel_daily_limit: 300          # 住宿每日上限（元）—— 对齐条款 3.2「普通员工一线城市 300 元/晚」口径
                                # 简化检查：发票无天数字段，按发票总额近似（真实应按 每日×天数，需结构化数据）
transport_standard: economy     # 交通标准：economy=经济舱/二等座
advance_required: true          # 差旅是否必须事前申请
advance_valid_days: 30          # 出差申请有效期（天，申请结束日期后顺延）

approval_rules:                 # 审批链规则（金额阈值 × 业务类型）
  # 业务：审批链长度/成员由公司制度决定（改 YAML 即改制度）；财务不参与审批，仅在批准后收付款通知（审批≠支付）
  - max_amount: 2000            # 小额（金额 < 2000）：直属上级单级审批，总经理仅收到告知（不占审批资源）
    chain: ["直属上级"]
  - min_amount: 2000            # 大额（金额 ≥ 2000）：需总经理最终审批
    chain: ["直属上级", "总经理"]
